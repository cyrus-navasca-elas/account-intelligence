competitors_context:
  manual_baseline: Spreadsheets + Outlook + phone
  named:
    - Procore Quality & Safety (weak on no-account external dispatch + re-inspection)
    - FTQ360 (point inspection app; no dispatch)
    - SafetyCulture (point inspection app; partial re-tracking)
  holdpoint_wedge:
    [dispatch to outside parties, escalates on silence, re-inspection auto-routing]

signal_weights:
  job_posting: high
  news_award: medium
  press_release: medium
  company_site: medium
  linkedin_post: low
